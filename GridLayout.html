<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid-Layout</title>
    <style>
        *{
            margin: 10px;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            background-color: #8A2BE2;
            color: white;
            text-align: center;
            padding: 20px;
            justify-content: center;
        }

        nav {
            background-color: #8B0000;
            color: white;
            text-align: center;
            padding: 20px;
            justify-content: center;
        }

        footer {
            background-color: #008000;
            color: white;
            text-align: center;
            padding: 20px;
            justify-content: center;
        }

        .contenedor-basico{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 300px);
            gap: 10px;
            justify-content: center;
            text-align: center;
        }

        .c1{
            background-color: #008080;
            grid-area: 1 / 1 / 3 / 2;
            justify-content: center;
            text-align: center;
        }

        .c2{
            background-color: #48D1CC;
            grid-area: 1 / 2 / 1 / 4;
            justify-content: center;
            text-align: center;
        }

        .c3{
            background-color: #F08080;
            grid-area: 2 / 2 / 2 / 4;
            justify-content: center;
            text-align: center;
        }

    </style>
</head>
<body>
<div>
    <header>
        <p>Header</p>
    </header>
</div>

<div>
    <nav>
        <p>Navigation</p>
    </nav>
</div>

<div class="contenedor-basico">
    <div class="c1"><p>Aside</p></div>
    <div class="c2"><p>Content</p></div>
    <div class="c3"><p>Section</p></div>
</div>

<footer>
    <p>Footer</p>
</footer>

</body>
</html>
