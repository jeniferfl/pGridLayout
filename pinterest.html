<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest temu</title>
    <style>
        .contenedor {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, minmax(120px, 1fr));
            gap: 10px;
            margin: 5% 5%;
        }
        .c1 {
            grid-column: 1;
            grid-row: 1;
        }

        .c2{
            grid-column: 1;
            grid-row: 2;
        }

        .c3{
            grid-column: 2 / span 2;
            grid-row: 1 / span 2;
        }

        .c4{
            grid-column: 1;
            grid-row: 3 / span 2;
        }

        .c5{
            grid-column: 2 / span 2;
            grid-row: 3;
        }

        .c6{
            grid-column: 2;
            grid-row: 4;
        }

        .c7{
            grid-column: 3;
            grid-row: 4;
        }

        .c8{
            grid-column: 4;
            grid-row: 3 / span 2;
        }

        .c9{
            grid-column: 4;
            grid-row: 1 / span 2;
        }

        .contenedor div {
            overflow: hidden;
        }

        .contenedor img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (width <= 375px) {
            .contenedor {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(6, minmax(120px, 1fr));
            }

            .c1 {
                grid-column: 1;
                grid-row: 1;
            }

            .c2 {
                grid-column: 2;
                grid-row: 1;
            }

            .c3 {
                grid-column: 1 / span 2;
                grid-row: 2;
            }

            .c4 {
                grid-column: 1;
                grid-row: 3 / span 2;
            }

            .c5 {
                grid-column: 2;
                grid-row: 3 / span 2;
            }

            .c6 {
                grid-column: 1;
                grid-row: 5;
            }

            .c7 {
                grid-column: 2;
                grid-row: 5;
            }

            .c8 {
                grid-column: 1;
                grid-row: 6;
            }

            .c9 {
                grid-column: 2;
                grid-row: 6;
            }
        }
        header {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .titulo-recuadro {
            text-align: center;
            border: 2px solid #333;
            padding: 15px 25px;
            font-family: sans-serif;
            border-radius: 8px;
        }
    </style>
</head>
    <body>
        <header>
            <h1 class="titulo-recuadro">Gustos de mujersss</h1>
        </header>
        <div class="contenedor">
            <div class="c1"><img src="imagenes/ghostface.jpg"></div>
            <div class="c2"><img src="imagenes/callOfduty.jpg"></div>
            <div class="c3"><img src="imagenes/eminem.jpg"></div>
            <div class="c4"><img src="imagenes/justinBieber.jpg"></div>
            <div class="c5"><img src="imagenes/lasAlucines.jpg"></div>
            <div class="c6"><img src="imagenes/perrucho.jpg"></div>
            <div class="c7"><img src="imagenes/serieFavorita.jpg"></div>
            <div class="c8"><img src="imagenes/comidaFav.png"></div>
            <div class="c9"><img src="imagenes/carroFav.jpg">/div>
            </div>
        </div>
    </body>>
</html>
